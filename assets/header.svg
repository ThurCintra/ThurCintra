<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="t d">
  <title id="t">Arthur Cintra</title>
  <desc id="d">Desenvolvedor em formação com foco em Inteligência Artificial e Cibersegurança. Franca, SP.</desc>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#94A3B8" fill-opacity=".14" />
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#34D399" stop-opacity=".35" />
      <stop offset="1" stop-color="#34D399" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#A78BFA" stop-opacity=".28" />
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="name" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#E6EDF3" />
      <stop offset=".45" stop-color="#E6EDF3" />
      <stop offset=".5" stop-color="#34D399" />
      <stop offset=".55" stop-color="#E6EDF3" />
      <stop offset="1" stop-color="#E6EDF3" />
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="5s" repeatCount="indefinite" />
    </linearGradient>
    <linearGradient id="scan" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#34D399" stop-opacity="0" />
      <stop offset=".5" stop-color="#34D399" stop-opacity=".09" />
      <stop offset="1" stop-color="#34D399" stop-opacity="0" />
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="330" rx="18" /></clipPath>
    <style>
      .type { font: 500 24px ui-monospace, 'Cascadia Code', 'JetBrains Mono', Consolas, 'Courier New', monospace; fill: #34D399; }
      .mono { font-family: ui-monospace, 'Cascadia Code', 'JetBrains Mono', Consolas, 'Courier New', monospace; }
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .float { animation: float 6s ease-in-out infinite; }
      .float2 { animation: float 8s ease-in-out infinite reverse; }
      @keyframes float { 50% { transform: translate(30px, 18px); } }
      .rise { animation: rise .9s ease-out both; }
      .rise2 { animation: rise .9s .25s ease-out both; }
      .rise3 { animation: rise .9s .5s ease-out both; }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
      .pulse { animation: pulse 2s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      @keyframes pulse { 50% { opacity: .35; transform: scale(1.6); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="330" fill="#0B0F14" />
    <rect width="1200" height="330" fill="url(#dots)" />
    <circle class="float" cx="230" cy="40" r="260" fill="url(#glow)" />
    <circle class="float2" cx="1080" cy="320" r="240" fill="url(#glow2)" />
    <rect width="1200" height="120" fill="url(#scan)">
      <animate attributeName="y" values="-120;330" dur="6s" repeatCount="indefinite" />
    </rect>
  </g>
  <rect x=".5" y=".5" width="1199" height="329" rx="18" fill="none" stroke="#233040" />

  <!-- Lado esquerdo: identidade -->
  <g class="rise">
    <text x="64" y="92" class="mono" font-size="20" fill="#34D399">~/arthur.cintra</text>
  </g>
  <g class="rise2">
    <text x="60" y="168" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="700" fill="url(#name)" letter-spacing="-1.5">Arthur Cintra</text>
  </g>
  <g class="rise3">
    <text x="64" y="214" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#93A1AE">Técnico em Desenvolvimento de Sistemas · SENAI</text>
    <circle class="pulse" cx="72" cy="258" r="6" fill="#34D399" />
    <circle cx="72" cy="258" r="6" fill="#34D399" />
    <text x="88" y="265" class="mono" font-size="18" fill="#E6EDF3">Franca, SP · online</text>
  </g>

  <!-- Lado direito: janela de terminal -->
  <g class="rise2">
    <rect x="630" y="70" width="520" height="210" rx="14" fill="#121A23" stroke="#233040" />
    <path d="M630 84a14 14 0 0 1 14-14h492a14 14 0 0 1 14 14v26H630z" fill="#18222D" />
    <line x1="630" y1="110" x2="1150" y2="110" stroke="#233040" />
    <circle cx="656" cy="90" r="6.5" fill="#FF5F57" />
    <circle cx="678" cy="90" r="6.5" fill="#FEBC2E" />
    <circle cx="700" cy="90" r="6.5" fill="#28C840" />
    <text x="722" y="95" class="mono" font-size="15" fill="#93A1AE">arthur@franca: ~</text>
    <text x="656" y="152" class="mono" font-size="20"><tspan fill="#34D399">$ </tspan><tspan fill="#E6EDF3">whoami</tspan></text>
    <text x="656" y="182" class="mono" font-size="18" fill="#93A1AE">Arthur Cintra de Lacerda</text>
    <text x="640" y="246" class="mono" font-size="24" fill="#34D399" text-anchor="start">›</text>
    
    <clipPath id="clip0"><rect x="660" y="222" height="34" width="0">
      <animate attributeName="width" dur="22.5s" repeatCount="indefinite" values="0;0;364;364;0;0" keyTimes="0;0.0001;0.08;0.15;0.18;1" />
    </rect></clipPath>
    <text x="660" y="246" clip-path="url(#clip0)" class="type">Desenvolvedor em formação</text>
    <clipPath id="clip1"><rect x="660" y="222" height="34" width="0">
      <animate attributeName="width" dur="22.5s" repeatCount="indefinite" values="0;0;278;278;0;0" keyTimes="0;0.2;0.28;0.35;0.38;1" />
    </rect></clipPath>
    <text x="660" y="246" clip-path="url(#clip1)" class="type">IA &amp; Cibersegurança</text>
    <clipPath id="clip2"><rect x="660" y="222" height="34" width="0">
      <animate attributeName="width" dur="22.5s" repeatCount="indefinite" values="0;0;422;422;0;0" keyTimes="0;0.4;0.48;0.55;0.58;1" />
    </rect></clipPath>
    <text x="660" y="246" clip-path="url(#clip2)" class="type">React · Node.js · Python · C#</text>
    <clipPath id="clip3"><rect x="660" y="222" height="34" width="0">
      <animate attributeName="width" dur="22.5s" repeatCount="indefinite" values="0;0;350;350;0;0" keyTimes="0;0.6;0.68;0.75;0.78;1" />
    </rect></clipPath>
    <text x="660" y="246" clip-path="url(#clip3)" class="type">Electron · .NET · YOLOv8</text>
    <clipPath id="clip4"><rect x="660" y="222" height="34" width="0">
      <animate attributeName="width" dur="22.5s" repeatCount="indefinite" values="0;0;364;364;0;0" keyTimes="0;0.8;0.88;0.95;0.98;1" />
    </rect></clipPath>
    <text x="660" y="246" clip-path="url(#clip4)" class="type">Aberto a estágio / júnior</text>
    <rect y="226" width="12" height="24" fill="#34D399" class="blink">
      <animate attributeName="x" dur="22.5s" repeatCount="indefinite" values="660;660;1024;1024;660;660;938;938;660;660;1082;1082;660;660;1010;1010;660;660;1024;1024;660;660" keyTimes="0;0.0001;0.08;0.15;0.18;0.2;0.28;0.35;0.38;0.4;0.48;0.55;0.58;0.6;0.68;0.75;0.78;0.8;0.88;0.95;0.98;1" />
    </rect>
  </g>
</svg>
