<svg xmlns="http://www.w3.org/2000/svg" width="900" height="54" viewBox="0 0 900 54" role="img" aria-label="atividade no github">
  <title>atividade no github</title>
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#34D399" stop-opacity="0" />
      <stop offset=".5" stop-color="#34D399" />
      <stop offset="1" stop-color="#34D399" stop-opacity="0" />
    </linearGradient>
    <style>
      .t { font: 600 22px ui-monospace, 'Cascadia Code', 'JetBrains Mono', Consolas, 'Courier New', monospace; }
      .in { animation: in .8s ease-out both; }
      @keyframes in { from { opacity: 0; transform: translateX(-12px); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>
  <g class="in">
    <text x="2" y="30" class="t"><tspan fill="#34D399">// </tspan><tspan fill="#C9D1D9">atividade no github</tspan></text>
  </g>
  <rect x="2" y="44" width="896" height="1" fill="#30363D" />
  <rect y="43" width="160" height="3" rx="1.5" fill="url(#g)">
    <animate attributeName="x" values="-160;900" dur="3.5s" repeatCount="indefinite" />
  </rect>
  <rect x="2" y="43" width="301" height="3" rx="1.5" fill="#34D399" opacity=".9">
    <animate attributeName="width" values="0;301" dur=".9s" fill="freeze" />
  </rect>
</svg>
